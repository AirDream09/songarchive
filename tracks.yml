# Speichern unter:  .github/workflows/tracks.yml
# Erzeugt bei jedem Upload in "musik/" automatisch musik/index.json,
# sortiert nach dem Datum, an dem die Datei hochgeladen wurde.
name: Titelliste aktualisieren

on:
  push:
    paths:
      - "musik/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: index.json erzeugen
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          audio = (".mp3", ".m4a", ".aac", ".ogg", ".oga", ".opus", ".wav", ".flac")
          files = [f for f in os.listdir("musik") if f.lower().endswith(audio + (".lrc",))]
          def added(f):
              out = subprocess.run(["git", "log", "--diff-filter=A", "--format=%ct", "--", "musik/" + f],
                                   capture_output=True, text=True).stdout.split()
              return int(out[-1]) if out else 0
          files.sort(key=lambda f: (added(f), f.lower()))
          with open("musik/index.json", "w", encoding="utf-8") as fh:
              json.dump(files, fh, ensure_ascii=False, indent=1)
          EOF
      - name: Änderung speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add musik/index.json
          git diff --cached --quiet || (git commit -m "Titelliste aktualisiert" && git push)
